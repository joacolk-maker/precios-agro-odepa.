name: Actualizar datos ODEPA

on:
  schedule:
    # Corre todos los dias a las 13:00 UTC (aprox. 10:00 hora Chile continental,
    # puede variar 1 hora segun horario de verano/invierno)
    - cron: "0 13 * * *"
  # Permite tambien correrlo manualmente desde la pestana "Actions" de GitHub,
  # util para probar que todo funciona sin esperar al horario programado
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script de actualizacion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python actualizar_datos.py
